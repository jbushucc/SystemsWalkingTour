<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour - Walking Tours</title>
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="tour-header">
            <button class="back-btn" onclick="goBack()">← Back</button>
            <h1 id="tour-title">Tour Name</h1>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </header>

        <main class="tour-main">
            <div class="location-info" id="location-info">
                <h2 id="location-title">Loading...</h2>
                <p id="location-description">Please wait while we load your tour.</p>
                <div class="location-text" id="location-text">
                </div>
            </div>

            <div class="map-container" id="map-container">
                <div id="leaflet-map" style="height: 300px; width: 100%;"></div>
            </div>

            <div class="audio-container" id="audio-container">
                <audio controls id="tour-audio">
                    <source src="" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>

            <div class="images-container" id="images-container">
            </div>

            <div class="navigation-buttons">
                <button class="nav-btn" id="prev-btn" onclick="previousStop()">← Previous</button>
                <button class="nav-btn primary" id="next-btn" onclick="nextStop()">Next →</button>
            </div>
        </main>
    </div>

    <script src="leaflet-src.js"></script>
    <script src="tours/tour-registry.js"></script>
    <script src="tour-script.js"></script>
</body>
</html>
